<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday Mum, I Love You!</title>
  <style>
    * { margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="error" style="position:absolute; top:10px; left:10px; color:#ff5555; font-family:monospace; white-space:pre; background:rgba(0,0,0,0.7); padding:10px; pointer-events:none;"></div>

  <script>
    const vsSource = `
      attribute vec2 a_position;
      void main() {
        gl_Position = vec4(a_position, 0.0, 1.0);
      }
    `;

    const fsSource = `
      precision mediump float;

      uniform float u_time;
      uniform vec2 u_resolution;
      uniform vec2 u_tapPos;     // tap position in the same UV space
      uniform float u_tapTime;   // time when the tap happened (-1 if none)

      // Clear heart shape
      float heart(vec2 p) {
        p.x = abs(p.x);
        p.y += 0.15;
        float a = atan(p.x, p.y) / 3.14159265;
        float r = length(p);
        float h = abs(a);
        float d = (13.0 * h - 22.0 * h * h + 10.0 * h * h * h) / (6.0 - 5.0 * h);
        return r - d * 0.42;
      }

      void main() {
        vec2 uv = (gl_FragCoord.xy - 0.5 * u_resolution.xy) / u_resolution.y;

        vec3 bg = vec3(0.04, 0.015, 0.07);
        vec3 color = bg;

        if (u_tapTime > 0.0) {
          float age = u_time - u_tapTime;

          // Animation timeline (seconds)
          float inDur   = 0.45;   // phase in
          float holdDur = 1.6;    // gentle pulse
          float outDur  = 0.7;    // phase out
          float total   = inDur + holdDur + outDur;

          if (age >= 0.0 && age < total) {
            // Overall intensity (0 to 1 to 0)
            float intensity = 1.0;
            if (age < inDur) {
              intensity = smoothstep(0.0, inDur, age);
            } else if (age > inDur + holdDur) {
              intensity = 1.0 - smoothstep(inDur + holdDur, total, age);
            }

            // Soft scale pulse during the hold
            float pulse = 1.0 + 0.06 * sin(age * 4.5) * step(inDur, age) * step(age, inDur + holdDur);

            // Position the heart at the tap location
            vec2 p = (uv - u_tapPos) / (0.38 * pulse * (0.6 + 0.4 * intensity));
            float d = heart(p);

            float body = smoothstep(0.02, -0.01, d) * intensity;
            float glow = smoothstep(0.28, 0.0, d) * 0.45 * intensity;

            vec3 heartCol = vec3(0.96, 0.28, 0.48);
            vec3 glowCol  = vec3(0.85, 0.35, 0.55);

            color = mix(color, glowCol, glow);
            color = mix(color, heartCol, body);
          }
        }

        // Soft vignette
        float vignette = smoothstep(1.2, 0.25, length(uv));
        color *= vignette;

        gl_FragColor = vec4(color, 1.0);
      }
    `;

    const canvas = document.getElementById('c');
    const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');

    if (!gl) {
      document.getElementById('error').textContent = 'WebGL not supported';
    }

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      gl.viewport(0, 0, canvas.width, canvas.height);
    }
    window.addEventListener('resize', resize);
    resize();

    function createShader(gl, type, source) {
      const shader = gl.createShader(type);
      gl.shaderSource(shader, source);
      gl.compileShader(shader);
      if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
        const err = gl.getShaderInfoLog(shader);
        console.error('SHADER ERROR:', err);
        document.getElementById('error').textContent += 'SHADER ERROR:\\n' + err + '\\n';
        gl.deleteShader(shader);
        return null;
      }
      return shader;
    }

    const vertexShader = createShader(gl, gl.VERTEX_SHADER, vsSource);
    const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fsSource);

    const program = gl.createProgram();
    gl.attachShader(program, vertexShader);
    gl.attachShader(program, fragmentShader);
    gl.linkProgram(program);

    if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
      document.getElementById('error').textContent += 'LINK ERROR:\\n' + gl.getProgramInfoLog(program);
    }

    gl.useProgram(program);

    const positions = new Float32Array([-1, -1, 3, -1, -1, 3]);
    const buffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
    gl.bufferData(gl.ARRAY_BUFFER, positions, gl.STATIC_DRAW);

    const positionLocation = gl.getAttribLocation(program, 'a_position');
    gl.enableVertexAttribArray(positionLocation);
    gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

    const timeLocation     = gl.getUniformLocation(program, 'u_time');
    const resolutionLocation = gl.getUniformLocation(program, 'u_resolution');
    const tapPosLocation   = gl.getUniformLocation(program, 'u_tapPos');
    const tapTimeLocation  = gl.getUniformLocation(program, 'u_tapTime');

    // Tap state
    let tapPos = [0, 0];
    let tapTime = -1.0;

    function setTap(clientX, clientY) {
      const rect = canvas.getBoundingClientRect();
      const x = clientX - rect.left;
      const y = clientY - rect.top;

      // Convert to the same centered UV space the shader uses
      const uvX = (x - canvas.width * 0.5) / canvas.height;
      const uvY = (canvas.height * 0.5 - y) / canvas.height; // flip Y

      tapPos = [uvX, uvY];
      tapTime = performance.now() * 0.001; // will be overwritten with shader time below
    }

    // Mouse
    canvas.addEventListener('click', (e) => {
      setTap(e.clientX, e.clientY);
    });

    // Touch
    canvas.addEventListener('touchstart', (e) => {
      e.preventDefault();
      const t = e.changedTouches[0];
      setTap(t.clientX, t.clientY);
    }, { passive: false });

    let startTime = performance.now();

    function render(now) {
      const time = (now - startTime) * 0.001;

      // Sync the tap time to the shader's time base on the first frame after a tap
      if (tapTime > 0 && Math.abs(tapTime - time) > 10) {
        tapTime = time;
      }

      gl.uniform1f(timeLocation, time);
      gl.uniform2f(resolutionLocation, canvas.width, canvas.height);
      gl.uniform2f(tapPosLocation, tapPos[0], tapPos[1]);
      gl.uniform1f(tapTimeLocation, tapTime);

      gl.drawArrays(gl.TRIANGLES, 0, 3);
      requestAnimationFrame(render);
    }
    requestAnimationFrame(render);
  </script>
</body>
</html>
